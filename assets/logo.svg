<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/><stop offset=".45" stop-color="#14b8a6"/><stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f766e"/><stop offset="1" stop-color="#3b0764"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="liq" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f472b6"/><stop offset=".55" stop-color="#fb923c"/><stop offset="1" stop-color="#facc15"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/><stop offset=".6" stop-color="#e0f2fe" stop-opacity=".85"/><stop offset="1" stop-color="#bae6fd" stop-opacity=".9"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fef08a"/><stop offset="1" stop-color="#f59e0b"/></radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#1e1b4b" flood-opacity=".45"/></filter>
    <clipPath id="flaskClip"><path d="M112 74h32v34l30 56c6 11-2 24-14 24H96c-12 0-20-13-14-24l30-56z"/></clipPath>
  </defs>
  <g filter="url(#sh)">
    <!-- sisi ekstrusi (efek 3D) -->
    <path d="M128 22l86 49.6v99.2L128 220.4 42 170.8V71.6z" transform="translate(0 14)" fill="url(#side)"/>
    <path d="M42 170.8L128 220.4l86-49.6v14L128 234.4 42 184.8z" fill="#2e1065" opacity=".55"/>
    <!-- muka depan -->
    <path d="M128 22l86 49.6v99.2L128 220.4 42 170.8V71.6z" fill="url(#face)"/>
    <path d="M128 34l75.6 43.6v87.2L128 208.4 52.4 164.8V77.6z" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="3"/>
    <path d="M128 22l86 49.6v30C170 92 100 92 42 110V71.6z" fill="url(#gloss)"/>
  </g>
  <!-- orbit atom di belakang labu -->
  <g fill="none" stroke="#fde047" stroke-width="5" stroke-linecap="round" opacity=".95">
    <ellipse cx="128" cy="132" rx="78" ry="26" transform="rotate(-24 128 132)"/>
  </g>
  <!-- labu Erlenmeyer -->
  <g>
    <path d="M112 74h32v34l30 56c6 11-2 24-14 24H96c-12 0-20-13-14-24l30-56z" fill="url(#glass)" stroke="#0f172a" stroke-opacity=".25" stroke-width="2"/>
    <g clip-path="url(#flaskClip)">
      <path d="M70 140 Q98 130 128 140 T186 140 V200 H70z" fill="url(#liq)">
        <animate attributeName="d" dur="2.4s" repeatCount="indefinite" values="M70 140 Q98 130 128 140 T186 140 V200 H70z;M70 140 Q98 150 128 140 T186 140 V200 H70z;M70 140 Q98 130 128 140 T186 140 V200 H70z"/>
      </path>
      <circle cx="112" cy="170" r="5" fill="#fff" opacity=".8"><animate attributeName="cy" values="182;142" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".9;0" dur="2s" repeatCount="indefinite"/></circle>
      <circle cx="138" cy="176" r="4" fill="#fff" opacity=".8"><animate attributeName="cy" values="184;144" dur="1.6s" begin=".5s" repeatCount="indefinite"/><animate attributeName="opacity" values=".9;0" dur="1.6s" begin=".5s" repeatCount="indefinite"/></circle>
      <circle cx="126" cy="166" r="3" fill="#fff" opacity=".8"><animate attributeName="cy" values="180;140" dur="2.3s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values=".9;0" dur="2.3s" begin="1s" repeatCount="indefinite"/></circle>
    </g>
    <rect x="106" y="66" width="44" height="12" rx="6" fill="#fff" stroke="#0f172a" stroke-opacity=".2" stroke-width="2"/>
    <path d="M100 150 L92 166" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".7"/>
  </g>
  <!-- orbit depan + elektron -->
  <path d="M57 159 A78 26 -24 0 0 199 105" fill="none" stroke="#fde047" stroke-width="5" stroke-linecap="round"/>
  <g>
    <circle r="9" fill="url(#glow)" stroke="#fff" stroke-width="2">
      <animateMotion dur="3.2s" repeatCount="indefinite" path="M199 105 A78 26 -24 1 0 57 159 A78 26 -24 1 0 199 105"/>
    </circle>
  </g>
  <!-- bintang petualang -->
  <path d="M188 58l5 11 12 2-9 8 2 12-10-6-10 6 2-12-9-8 12-2z" fill="#fde047" stroke="#fff" stroke-width="2">
    <animateTransform attributeName="transform" type="rotate" values="0 188 72;12 188 72;0 188 72" dur="3s" repeatCount="indefinite"/>
  </path>
  <circle cx="70" cy="86" r="4" fill="#fff" opacity=".9"><animate attributeName="opacity" values=".2;1;.2" dur="2.2s" repeatCount="indefinite"/></circle>
</svg>
