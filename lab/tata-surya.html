<!DOCTYPE html>
<html lang="id" data-lab="tata-surya">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Simulasi Tata Surya 3D</title>
<link rel="stylesheet" href="../assets/lab-common.css">
<script src="../assets/lab-common.js"></script>
<style>
:root{
  --bg:#050816; --panel:rgba(16,22,58,.86); --line:rgba(120,170,255,.28);
  --text:#F2F5FF; --muted:#AEB9E8; --gold:#FFC93C; --sky:#4CC9F0; --mint:#06D6A0; --pink:#FF5D8F; --lav:#B388FF;
  --fs:clamp(15px,1.15vw,26px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:"Segoe UI",Calibri,Arial,sans-serif;font-size:var(--fs);touch-action:none;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
.glass{background:var(--panel);border:1px solid var(--line);border-radius:1.1em;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 .6em 2em rgba(0,0,0,.45)}

/* header */
#title{position:fixed;left:1.2em;top:1em;padding:.7em 1.1em;pointer-events:none}
#title h1{margin:0;font-size:1.55em;letter-spacing:.02em}
#title h1 span{color:var(--gold)}
#title p{margin:.15em 0 0;color:var(--muted);font-size:.85em}
#clock{margin-top:.4em;font-weight:700;color:var(--sky);font-size:.95em}

/* controls */
#controls{position:fixed;right:1.2em;top:1em;display:flex;gap:.55em;flex-wrap:wrap;justify-content:flex-end;max-width:62vw}
.cbtn{min-width:3.4em;min-height:3.4em;padding:.5em .9em;border-radius:1em;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center;gap:.45em;font-weight:700;font-size:.9em;transition:transform .15s,background .2s}
.cbtn:active{transform:scale(.93)}
.cbtn.on{background:var(--sky);color:#0B1026;border-color:var(--sky)}
.cbtn svg{width:1.4em;height:1.4em;fill:currentColor}
#speedBox{display:flex;align-items:center;gap:.7em;padding:.4em 1em;min-height:3.4em}
#speedBox label{font-weight:700;font-size:.85em;color:var(--muted)}
#speedVal{font-weight:800;color:var(--gold);min-width:3.2em;text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;width:11em;height:.55em;border-radius:1em;background:rgba(255,255,255,.18);outline:none;touch-action:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:2em;height:2em;border-radius:50%;background:var(--gold);border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.5)}
input[type=range]::-moz-range-thumb{width:2em;height:2em;border-radius:50%;background:var(--gold);border:3px solid #fff}

/* planet bar (horizontal touch scroll) */
#barWrap{position:fixed;left:50%;transform:translateX(-50%);bottom:1em;width:min(96vw,1500px);padding:.6em .7em}
#barHint{font-size:.75em;color:var(--muted);margin:0 0 .35em .4em}
#bar{display:flex;gap:.6em;overflow-x:auto;overflow-y:hidden;touch-action:pan-x;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;padding-bottom:.35em;scrollbar-width:thin}
#bar::-webkit-scrollbar{height:.5em}#bar::-webkit-scrollbar-thumb{background:var(--line);border-radius:1em}
.pbtn{flex:0 0 auto;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;gap:.3em;min-width:6.6em;padding:.55em .6em;border-radius:1em;border:2px solid transparent;background:rgba(255,255,255,.05);font-weight:700;font-size:.85em}
.pbtn canvas{width:3.4em;height:3.4em}
.pbtn.sel{border-color:var(--gold);background:rgba(255,201,60,.14)}
.pbtn small{display:block;font-weight:500;color:var(--muted);font-size:.78em}

/* labels */
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-140%);padding:.22em .7em;border-radius:1em;background:rgba(11,16,38,.7);border:1px solid var(--line);font-weight:700;font-size:.8em;white-space:nowrap;pointer-events:auto;cursor:pointer}
.lbl.sel{background:var(--gold);color:#0B1026;border-color:var(--gold)}
body.nolabels .lbl{display:none}

/* info panel (vertical touch scroll) */
#info{position:fixed;right:1.2em;top:6.2em;bottom:9.6em;width:min(30em,40vw);display:flex;flex-direction:column;transform:translateX(120%);transition:transform .45s cubic-bezier(.2,.8,.2,1);overflow:hidden}
#info.open{transform:none}
#infoHead{display:flex;align-items:center;gap:.8em;padding:1em 1em .6em}
#infoHead canvas{width:4.2em;height:4.2em;flex:0 0 auto}
#infoHead h2{margin:0;font-size:1.6em}
#infoTag{color:var(--gold);font-style:italic;font-size:.88em;margin-top:.15em}
#closeInfo{margin-left:auto;align-self:flex-start;width:2.8em;height:2.8em;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.08);font-size:1.1em;font-weight:800}
#infoBody{flex:1;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;padding:0 1em 1em;overscroll-behavior:contain}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:.55em;margin:.4em 0 .9em}
.stat{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:.8em;padding:.55em .7em}
.stat b{display:block;font-size:1.08em}
.stat span{font-size:.72em;font-weight:700;color:var(--sky);text-transform:uppercase;letter-spacing:.04em}
.fact{background:rgba(255,201,60,.1);border:1px solid rgba(255,201,60,.4);border-radius:.9em;padding:.8em .9em;line-height:1.45}
.fact h3{margin:0 0 .3em;color:var(--gold);font-size:.95em}
.cmp{margin-top:.9em;line-height:1.45;color:var(--muted);font-size:.9em}
.cmp .barRow{display:flex;align-items:center;gap:.6em;margin:.35em 0}
.cmp .barRow i{display:block;height:.7em;border-radius:1em;background:var(--sky)}
.cmp .barRow em{font-style:normal;min-width:4.6em;color:var(--text);font-weight:700}
#infoFoot{display:flex;gap:.6em;padding:.8em 1em 1em;border-top:1px solid var(--line)}
#infoFoot .cbtn{flex:1}

/* help */
#help{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:1.4em 1.8em;max-width:min(40em,90vw);text-align:center;transition:opacity .6s}
#help h2{margin:.1em 0 .6em;color:var(--gold)}
#help .g{display:grid;grid-template-columns:repeat(3,1fr);gap:.9em;margin-bottom:1em}
#help .g div{background:rgba(255,255,255,.06);border-radius:.9em;padding:.8em .5em;font-size:.9em;line-height:1.35}
#help .g div b{display:block;font-size:2em;margin-bottom:.15em}
#help.hide{opacity:0;pointer-events:none}
#startBtn{background:var(--gold);color:#0B1026;border:none;min-width:12em}

@media (max-width:900px){#info{width:auto;left:1em;top:auto;bottom:9.6em;height:48vh}#controls{max-width:96vw;top:auto;bottom:10em;right:.6em;left:.6em;justify-content:center}#title{font-size:.85em}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>

<div id="title" class="glass">
  <h1>Simulasi <span>Tata Surya</span> 3D</h1>
  <p>IPA Kelas VII · SMP Negeri 4 Magelang</p>
  <div id="clock">Hari ke-0 · Tahun Bumi ke-0</div>
</div>

<div id="controls">
  <button class="cbtn" id="playBtn" title="Jeda / Putar"></button>
  <div class="cbtn" id="speedBox"><label>Kecepatan</label><input id="speed" type="range" min="0" max="8" step="1" value="3"><span id="speedVal">1×</span></div>
  <button class="cbtn on" id="orbitBtn">Orbit</button>
  <button class="cbtn on" id="labelBtn">Nama</button>
  <button class="cbtn" id="tourBtn">Tur Otomatis</button>
  <button class="cbtn" id="resetBtn">Lihat Semua</button>
  <button class="cbtn" id="helpBtn" title="Petunjuk">?</button>
  <button class="cbtn" id="fsBtn" title="Layar penuh"></button>
</div>

<div id="info" class="glass">
  <div id="infoHead"><canvas id="infoImg" width="160" height="160"></canvas><div><h2 id="infoName"></h2><div id="infoTag"></div></div><button id="closeInfo" aria-label="Tutup">✕</button></div>
  <div id="infoBody"></div>
  <div id="infoFoot"><button class="cbtn" id="prevP">◀ Sebelumnya</button><button class="cbtn" id="nextP">Berikutnya ▶</button></div>
</div>

<div id="barWrap" class="glass"><div id="barHint">Geser ke kiri/kanan, lalu ketuk untuk menjelajah</div><div id="bar"></div></div>

<div id="help" class="glass">
  <h2>Cara Menjelajah</h2>
  <div class="g">
    <div><b>☝️</b>Geser 1 jari<br>untuk memutar pandangan</div>
    <div><b>🤏</b>Cubit 2 jari<br>untuk memperbesar / memperkecil</div>
    <div><b>👆</b>Ketuk planet<br>untuk melihat informasinya</div>
  </div>
  <button class="cbtn" id="startBtn">Mulai Menjelajah</button>
</div>

<script src="../assets/three.min.js"></script>
<script>
(() => {
"use strict";
// ================= DATA =================
const PLANETS = [
 {key:"matahari",name:"Matahari",sub:"Bintang",r:5,dist:0,period:0,rotH:600,tilt:7,col:"#FFB627",
  tag:"Bintang pusat tata surya kita",

  tag:"Si Planet Merah",

 {key:"jupiter",name:"Jupiter",sub:"Planet ke-5",r:3.1,dist:36,period:4333,rotH:9.9,tilt:3,col:"#D9AE7E",diaKm:142984,
  tag:"Planet terbesar di tata surya",
  stats:[["Jarak ke Matahari","778 juta km"],["Diameter","142.984 km"],["Jumlah satelit","lebih dari 90"],["1 tahun (revolusi)","11,9 tahun"],["1 hari (rotasi)","± 10 jam"],["Suhu","± -110°C"]],

 {key:"saturnus",name:"Saturnus",sub:"Planet ke-6",r:2.6,dist:48,period:10759,rotH:10.7,tilt:26.7,col:"#E1C48A",diaKm:120536,
  tag:"Planet dengan cincin paling indah",
  stats:[["Jarak ke Matahari","1,4 miliar km"],["Diameter","120.536 km"],["Jumlah satelit","lebih dari 200"],["1 tahun (revolusi)","29,5 tahun"],["1 hari (rotasi)","± 10,7 jam"],["Suhu","± -140°C"]],
  fakta:"Cincin Saturnus tersusun dari bongkahan es dan batu. Saturnus sangat ringan: kalau ada kolam raksasa, Saturnus bisa mengapung!"},
 {key:"uranus",name:"Uranus",sub:"Planet ke-7",r:1.7,dist:59,period:30687,rotH:-17.2,tilt:97.8,col:"#86D9E3",diaKm:51118,
  tag:"Berotasi sambil menggelinding",
  stats:[["Jarak ke Matahari","2,9 miliar km"],["Diameter","51.118 km"],["Jumlah satelit","lebih dari 25"],["1 tahun (revolusi)","84 tahun"],["1 hari (rotasi)","± 17 jam"],["Suhu","± -195°C"]],
  fakta:"Sumbu Uranus sangat miring (± 98°), sehingga ia seperti bola yang menggelinding. Perhatikan putarannya di simulasi! Warnanya berasal dari gas metana."},
 {key:"neptunus",name:"Neptunus",sub:"Planet ke-8",r:1.65,dist:69,period:60190,rotH:16.1,tilt:28,col:"#3A5BD9",diaKm:49528,
  tag:"Planet terjauh dan paling berangin",
  stats:[["Jarak ke Matahari","4,5 miliar km"],["Diameter","49.528 km"],["Jumlah satelit","16"],["1 tahun (revolusi)","165 tahun"],["1 hari (rotasi)","± 16 jam"],["Suhu","± -200°C"]],
  fakta:"Angin di Neptunus bisa mencapai ± 2.000 km/jam, tercepat di tata surya. Neptunus ditemukan lewat perhitungan matematika sebelum terlihat teleskop."},
];
const SPEEDS=[0,0.25,0.5,1,2,5,10,25,60];
const SEC_PER_EARTH_YEAR=24; // at 1× one Earth year = 24 seconds

// ================= PROCEDURAL TEXTURES =================
let seed=11; const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
function noiseCanvas(w,h,draw){const c=document.createElement("canvas");c.width=w;c.height=h;draw(c.getContext("2d"),w,h);return c}
function blobs(g,w,h,n,cols,rmin,rmax,alpha){for(let i=0;i<n;i++){g.globalAlpha=alpha*(0.5+rnd()*0.5);g.fillStyle=cols[Math.floor(rnd()*cols.length)];const x=rnd()*w,y=rnd()*h,r=rmin+rnd()*(rmax-rmin);g.beginPath();g.ellipse(x,y,r*1.6,r,0,0,Math.PI*2);g.fill();if(x<rmax*2){g.beginPath();g.ellipse(x+w,y,r*1.6,r,0,0,Math.PI*2);g.fill()}if(x>w-rmax*2){g.beginPath();g.ellipse(x-w,y,r*1.6,r,0,0,Math.PI*2);g.fill()}}g.globalAlpha=1}
function bands(g,w,h,cols,blur){let y=0;while(y<h){const bh=h*(0.025+rnd()*0.07);g.fillStyle=cols[Math.floor(rnd()*cols.length)];g.globalAlpha=0.55+rnd()*0.45;g.fillRect(0,y,w,bh);y+=bh}g.globalAlpha=1;
  for(let i=0;i<260;i++){g.globalAlpha=0.08;g.fillStyle=cols[Math.floor(rnd()*cols.length)];const yy=rnd()*h;g.fillRect(0,yy,w,1+rnd()*blur)}g.globalAlpha=1}
const TEX={};
function makeTexCanvas(key){
  const S=(window.LAB&&LAB.lite)?1:2,W=1024*S,H=512*S;
  return noiseCanvas(W,H,(g,w,h)=>{g.scale(S,S);w=1024;h=512;
    const fill=(c)=>{g.fillStyle=c;g.fillRect(0,0,w,h)};
    switch(key){
      case "matahari":{fill("#FFB01F");blobs(g,w,h,900,["#FFE37A","#FF8A00","#FFD24A","#FF6A00"],4,26,.35);break}
      case "merkurius":{fill("#958E87");blobs(g,w,h,300,["#7A746E","#A8A19A","#6B655F"],3,26,.45);for(let i=0;i<160;i++){const x=rnd()*w,y=rnd()*h,r=2+rnd()*12;g.strokeStyle="rgba(60,55,50,.5)";g.lineWidth=1.5;g.beginPath();g.ellipse(x,y,r*1.6,r,0,0,Math.PI*2);g.stroke()}break}
      case "venus":{fill("#D9AE63");bands(g,w,h,["#F2D59A","#C99A4F","#E8C27A","#B8893F"],6);blobs(g,w,h,200,["#F6E1B0","#C49448"],10,40,.18);break}
      case "bumi":{fill("#1F5FC4");blobs(g,w,h,220,["#2367D0","#1B52AD"],10,40,.4);
        g.fillStyle="#3FA34D";const cont=[[180,170,120,90],[260,300,70,110],[520,150,150,80],[560,300,90,110],[800,180,110,70],[840,330,60,40],[420,200,40,60]];
        cont.forEach(([x,y,rx,ry])=>{for(let i=0;i<34;i++){g.globalAlpha=.95;g.fillStyle=["#3E9A48","#4CAF58","#6E9A3C","#B9A564"][Math.floor(rnd()*4)];g.beginPath();g.ellipse(x+(rnd()-.5)*rx*1.1,y+(rnd()-.5)*ry*1.1,rx*(.1+rnd()*.2),ry*(.1+rnd()*.2),rnd()*3,0,Math.PI*2);g.fill()}});
        g.globalAlpha=1;g.fillStyle="#F4F8FF";g.fillRect(0,0,w,34);g.fillRect(0,h-30,w,30);
        for(let i=0;i<60;i++){g.globalAlpha=.25+rnd()*.25;g.fillStyle="#fff";g.beginPath();g.ellipse(rnd()*w,40+rnd()*(h-80),20+rnd()*70,4+rnd()*8,0,0,Math.PI*2);g.fill()}g.globalAlpha=1;break}
      case "mars":{fill("#BF5029");blobs(g,w,h,260,["#8E3A1E","#D9683A","#A84522","#E07B4B"],6,40,.35);g.fillStyle="#FBEDE6";g.fillRect(0,0,w,22);g.fillRect(0,h-18,w,18);break}
      case "jupiter":{fill("#D9AE7E");bands(g,w,h,["#F2DFC2","#B67F52","#E8CDA6","#A86E44","#C38D5E","#F4E3C8"],5);
        g.fillStyle="#C2452D";g.globalAlpha=.95;g.beginPath();g.ellipse(640,320,62,30,0,0,Math.PI*2);g.fill();g.fillStyle="#D9603F";g.beginPath();g.ellipse(640,320,42,18,0,0,Math.PI*2);g.fill();g.globalAlpha=1;break}
      case "saturnus":{fill("#E1C48A");bands(g,w,h,["#F3DFB0","#C9A66A","#E8D09A","#D6B678"],4);break}
      case "uranus":{fill("#86D9E3");bands(g,w,h,["#93E0E8","#7CCFDA","#A6EAF0"],3);break}
      case "neptunus":{fill("#3755D2");bands(g,w,h,["#2C45B0","#4466E0","#3A5BD9","#5A7BEA"],4);g.fillStyle="#1E2F86";g.beginPath();g.ellipse(400,300,50,24,0,0,Math.PI*2);g.fill();g.strokeStyle="rgba(230,240,255,.8)";g.lineWidth=5;g.beginPath();g.moveTo(470,280);g.quadraticCurveTo(520,268,580,280);g.stroke();break}
      case "bulan":{fill("#B9BDC3");blobs(g,w,h,240,["#8F949B","#A3A7AD","#CDD1D6"],4,34,.5);break}
    }
    g.setTransform(1,0,0,1,0,0);hdDetail(g,W,H,key);
  });
}
function hdDetail(g,W,H,key){
  if(window.LAB&&LAB.lite)return;
  const gas=["jupiter","saturnus","uranus","neptunus","venus"].includes(key);
  if(gas){const src=document.createElement("canvas");src.width=W;src.height=H;src.getContext("2d").drawImage(g.canvas,0,0);
    for(let y=0;y<H;y+=2){const off=Math.sin(y*.011)*W*.012+Math.sin(y*.047+1.7)*W*.006+Math.sin(y*.155)*W*.002;
      g.drawImage(src,0,y,W,2,off,y,W,2);g.drawImage(src,0,y,W,2,off-W,y,W,2);g.drawImage(src,0,y,W,2,off+W,y,W,2)}
    for(let i=0;i<(key==="jupiter"?160:50);i++){const x=rnd()*W,y=rnd()*H,r=W*(.002+rnd()*.008);g.globalAlpha=.22;g.strokeStyle=rnd()<.5?"rgba(255,255,255,.7)":"rgba(90,50,20,.6)";g.lineWidth=1+rnd()*2;g.beginPath();g.ellipse(x,y,r*2.6,r,0,0,Math.PI*1.6);g.stroke()}

  if(["merkurius","mars","bulan"].includes(key)){for(let i=0;i<(key==="mars"?140:460);i++){const x=rnd()*W,y=rnd()*H,r=W*(.001+rnd()*.007);

const cam={target:new THREE.Vector3(),theta:0.6,phi:1.05,radius:120,goal:{theta:0.6,phi:1.05,radius:120},follow:null,goalTarget:new THREE.Vector3()};
const MIN_R=1.5,MAX_R=420;
function applyCam(dt){
  const k=1-Math.pow(0.0015,dt);
  if(cam.follow!=null){bodies[cam.follow].holder.getWorldPosition(cam.goalTarget)}
  cam.target.lerp(cam.goalTarget,cam.follow!=null?Math.min(1,k*1.6):k);
  cam.theta+= (cam.goal.theta-cam.theta)*k; cam.phi+=(cam.goal.phi-cam.phi)*k; cam.radius+=(cam.goal.radius-cam.radius)*k;
  const s=Math.sin(cam.phi);
  camera.position.set(cam.target.x+cam.radius*s*Math.sin(cam.theta),cam.target.y+cam.radius*Math.cos(cam.phi),cam.target.z+cam.radius*s*Math.cos(cam.theta));
  camera.lookAt(cam.target);
}
const pointers=new Map();let gesture=null;
canvas.addEventListener("pointerdown",e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,t:performance.now()});startGesture();userActive()});
canvas.addEventListener("pointermove",e=>{const p=pointers.get(e.pointerId);if(!p)return;p.x=e.clientX;p.y=e.clientY;moveGesture()});
const endP=e=>{const p=pointers.get(e.pointerId);if(!p)return;
  const moved=Math.hypot(p.x-p.sx,p.y-p.sy),dt=performance.now()-p.t;
  pointers.delete(e.pointerId);
  if(gesture&&gesture.single&&moved<12&&dt<450)pick(e.clientX,e.clientY);
  startGesture()};
canvas.addEventListener("pointerup",endP);canvas.addEventListener("pointercancel",endP);
function startGesture(){
  const ps=[...pointers.values()];
  if(ps.length===1)gesture={single:pointers.size===1&&!gesture?.wasMulti,x:ps[0].x,y:ps[0].y,wasMulti:gesture?.wasMulti};
  else if(ps.length>=2){const[a,b]=ps;gesture={multi:true,wasMulti:true,d:Math.hypot(a.x-b.x,a.y-b.y),mx:(a.x+b.x)/2,my:(a.y+b.y)/2}}
  else gesture=null;
}
function moveGesture(){
  const ps=[...pointers.values()];if(!gesture)return;
  if(ps.length===1&&!gesture.multi){const p=ps[0],dx=p.x-gesture.x,dy=p.y-gesture.y;gesture.x=p.x;gesture.y=p.y;
    if(Math.hypot(p.x-p.sx,p.y-p.sy)>12)gesture.single=false;
    cam.goal.theta-=dx*0.006;cam.goal.phi=THREE.MathUtils.clamp(cam.goal.phi-dy*0.006,0.08,Math.PI-0.08)}
  else if(ps.length>=2&&gesture.multi){const[a,b]=ps,d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    if(gesture.d>0)zoomBy(gesture.d/d);
    if(cam.follow==null)pan(mx-gesture.mx,my-gesture.my);
    gesture.d=d;gesture.mx=mx;gesture.my=my}
}
function zoomBy(f){cam.goal.radius=THREE.MathUtils.clamp(cam.goal.radius*f,cam.follow!=null?bodies[cam.follow].data.r*1.6:MIN_R,MAX_R)}
function pan(dx,dy){const sc=cam.radius*0.0016;const right=new THREE.Vector3().setFromMatrixColumn(camera.matrix,0),up=new THREE.Vector3().setFromMatrixColumn(camera.matrix,1);
  cam.goalTarget.addScaledVector(right,-dx*sc).addScaledVector(up,dy*sc)}
canvas.addEventListener("wheel",e=>{e.preventDefault();zoomBy(Math.exp(e.deltaY*0.0012));userActive()},{passive:false});

const ICON={play:'<svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>',pause:'<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>',
  fs:'<svg viewBox="0 0 24 24"><path d="M4 4h6v2H6v4H4zM14 4h6v6h-2V6h-4zM4 14h2v4h4v2H4zM18 14h2v6h-6v-2h4z"/></svg>'};
let selected=null,paused=false,speedIdx=3;
bodies.forEach((b,i)=>{
  const btn=document.createElement("button");btn.className="pbtn";
  const cv=document.createElement("canvas");cv.width=cv.height=128;thumb(cv,b.data.key);btn.appendChild(cv);
  btn.insertAdjacentHTML("beforeend",`<span>${b.data.name}<small>${b.data.sub}</small></span>`);
  btn.addEventListener("click",()=>{select(i);userActive()});bar.appendChild(btn);b.btn=btn;
  const l=document.createElement("div");l.className="lbl";l.textContent=b.data.name;l.addEventListener("pointerup",e=>{e.stopPropagation();select(i)});labels.appendChild(l);b.label=l;
});
function select(i){
  selected=i;cam.follow=i;const p=bodies[i].data;
  cam.goal.radius=p.key==="matahari"?28:Math.max(p.r*5.5,4.5);
  if(p.key==="saturnus")cam.goal.radius=p.r*7;
  cam.goal.phi=Math.min(cam.goal.phi,1.25);
  bodies.forEach((b,j)=>{b.btn.classList.toggle("sel",j===i);b.label.classList.toggle("sel",j===i)});
  bodies[i].btn.scrollIntoView({behavior:"smooth",inline:"center",block:"nearest"});
  $("infoName").textContent=p.name;if(window.LAB&&LAB.guide)LAB.guide.show("ts_"+p.key,(p.name+". "+p.tag+". "+p.fakta).replace(/<[^>]+>/g,""));$("infoTag").textContent=p.tag;thumb($("infoImg"),p.key);
  let html=`<div class="stats">${p.stats.map(([l,v])=>`<div class="stat"><span>${l}</span><b>${v}</b></div>`).join("")}</div>`;
  html+=`<div class="fact"><h3>💡 Fakta Unik</h3>${p.fakta}</div>`;
  if(p.diaKm){const max=142984;html+=`<div class="cmp"><b style="color:var(--text)">Perbandingan ukuran dengan Bumi</b>
    <div class="barRow"><em>${p.name}</em><i style="width:${Math.max(2,p.diaKm/max*70)}%;background:${p.col}"></i></div>
    <div class="barRow"><em>Bumi</em><i style="width:${12756/max*70}%"></i></div>
    Diameter ${p.name} ≈ <b style="color:var(--gold)">${(p.diaKm/12756).toLocaleString("id-ID",{maximumFractionDigits:2})}×</b> diameter Bumi.</div>`}
  $("infoBody").innerHTML=html;$("infoBody").scrollTop=0;info.classList.add("open");
}
function deselect(){selected=null;cam.follow=null;info.classList.remove("open");bodies.forEach(b=>{b.btn.classList.remove("sel");b.label.classList.remove("sel")})}
function overview(){deselect();cam.goalTarget.set(0,0,0);cam.goal.radius=120;cam.goal.phi=1.05}
$("closeInfo").onclick=()=>{deselect()};
$("prevP").onclick=()=>select(((selected??0)-1+bodies.length)%bodies.length);
$("nextP").onclick=()=>select(((selected??-1)+1)%bodies.length);
$("resetBtn").onclick=()=>{stopTour();overview()};
const playBtn=$("playBtn");const setPlay=()=>{playBtn.innerHTML=paused?ICON.play+"Putar":ICON.pause+"Jeda";playBtn.classList.toggle("on",paused)};setPlay();
playBtn.onclick=()=>{paused=!paused;setPlay()};
const sp=$("speed");const setSpeed=()=>{speedIdx=+sp.value;const v=SPEEDS[speedIdx];$("speedVal").textContent=v===0?"Diam":v+"×"};sp.oninput=setSpeed;setSpeed();
$("orbitBtn").onclick=e=>{const on=e.currentTarget.classList.toggle("on");bodies.forEach(b=>{if(b.orbitLine)b.orbitLine.visible=on;if(b.moonLine)b.moonLine.visible=on})};
$("labelBtn").onclick=e=>{const on=e.currentTarget.classList.toggle("on");document.body.classList.toggle("nolabels",!on)};
$("fsBtn").innerHTML=ICON.fs;
$("fsBtn").onclick=()=>{const d=document;if(!d.fullscreenElement)(d.documentElement.requestFullscreen||d.documentElement.webkitRequestFullscreen).call(d.documentElement);else(d.exitFullscreen||d.webkitExitFullscreen).call(d)};
$("helpBtn").onclick=()=>$("help").classList.remove("hide");
$("startBtn").onclick=()=>$("help").classList.add("hide");
// tour
let tourTimer=null;
function stopTour(){clearInterval(tourTimer);tourTimer=null;$("tourBtn").classList.remove("on")}
$("tourBtn").onclick=()=>{if(tourTimer){stopTour();return}$("tourBtn").classList.add("on");let i=(selected??-1)+1;select(i%bodies.length);tourTimer=setInterval(()=>{i++;select(i%bodies.length)},9000)};
function userActive(){if(tourTimer&&!info.contains(document.activeElement))stopTour()}
// idle: return to auto tour after 3 min without touches (for display TV)
let lastTouch=performance.now();["pointerdown","wheel"].forEach(ev=>addEventListener(ev,()=>lastTouch=performance.now(),true));

// ================= LOOP =================
let simDays=0,last=performance.now();
const tmp=new THREE.Vector3();
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
addEventListener("resize",resize);resize();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;if(window.__hdTick)__hdTick(dt,now);
  const speed=paused?0:SPEEDS[speedIdx];
  const daysStep=dt*speed*(365.25/SEC_PER_EARTH_YEAR);simDays+=daysStep;
  bodies.forEach(b=>{const p=b.data;
    if(p.period){b.angle+=daysStep/p.period*Math.PI*2;b.holder.position.set(Math.cos(b.angle)*p.dist,0,-Math.sin(b.angle)*p.dist)}
    const spin=Math.sign(p.rotH)*Math.min(4,Math.sqrt(24/Math.abs(p.rotH))*2.2);b.mesh.rotation.y+=spin*dt*Math.min(speed,3)*0.5;
    if(b.moonPivot)b.moonPivot.rotation.y+=daysStep/27.3*Math.PI*2;
  });
  belt.rotation.y+=daysStep/1600*Math.PI*2;
  if(!tourTimer&&now-lastTouch>180000&&$("help").classList.contains("hide")){$("tourBtn").click()}
  applyCam(dt);
  // labels
  const W=innerWidth,H=innerHeight;
  bodies.forEach(b=>{b.holder.getWorldPosition(tmp);tmp.y+=b.data.r;tmp.project(camera);
    if(tmp.z>1||tmp.z<-1){b.label.style.display="none";return}
    b.label.style.display="";b.label.style.left=((tmp.x+1)/2*W)+"px";b.label.style.top=((1-tmp.y)/2*H)+"px"});
  const yr=Math.floor(simDays/365.25);$("clock").textContent=`Hari ke-${Math.floor(simDays).toLocaleString("id-ID")} · Tahun Bumi ke-${yr}`;
  renderer.render(scene,camera);requestAnimationFrame(frame);
}
if(window.LAB&&LAB.guide)LAB.guide.init("tata-surya","ts_greet","Halo! Selamat datang di simulasi Tata Surya. Saya Bu Nella. Ketuk salah satu planet untuk mengenalnya lebih dekat, atau tekan Tur Otomatis untuk berkeliling tata surya!");
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
