<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Lab Virtual 3D — Lab Petualang</title>
<link rel="icon" type="image/svg+xml" href="../assets/logo.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<meta name="theme-color" content="#0b1430">

<link rel="stylesheet" href="../assets/lab-common.css">
<script src="../assets/dialog.js"></script>

<body>
<canvas id="c"></canvas>
<div id="labels"></div>
<header id="top" class="glass">

<div id="infoBg"></div><div id="info" class="glass"></div>
<div id="hint">☝️ Geser untuk memutar · 🤏 cubit / scroll untuk zoom · 👆 ketuk objek untuk info</div>

<script src="../assets/three.min.js"></script>
